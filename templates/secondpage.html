<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="index">
    <div class="form-container">
        <h1>Enter Your Details</h1>
        <form onsubmit="event.preventDefault(); saveAndGo();">
            <label>Name:</label>
            <input type="text" id="userName" placeholder="Enter your name" required>

            <label>Age:</label>
            <input type="number" id="userAge" placeholder="Enter your age" required>

            <label>Injury:</label>
            <select id="userInjury">
                <option value="No Injury">No Injury</option>
                <option value="Lower Back Pain">Lower Back Pain</option>
                <option value="Knee Pain">Knee Pain</option>
                <option value="Wrist Pain">Wrist Pain</option>
                <option value="Shoulder Injury">Shoulder Injury</option>
            </select>

            <label>Food Preference:</label>
            <select id="userPreference">
                <option value="Vegetarian">Vegetarian</option>
                <option value="Vegan">Vegan</option>
                <option value="Non-Vegetarian">Non-Vegetarian</option>
            </select>

            <label>Fitness Goal:</label>
            <select id="userGoal">
                <option value="General Fitness">General Fitness</option>
                <option value="Weight Loss">Weight Loss</option>
                <option value="Muscle Gain">Muscle Gain</option>
                <option value="Rehabilitation">Rehabilitation</option>
            </select>

            <button type="submit" class="btn">Submit & Go to Dashboard</button>
        </form>
    </div>

    <script>
    function saveAndGo() {
        const name = document.getElementById('userName').value;
        const age = document.getElementById('userAge').value;
        const injury = document.getElementById('userInjury').value;
        const preference = document.getElementById('userPreference').value;
        const goal = document.getElementById('userGoal').value;

        localStorage.setItem('userName', name);
        localStorage.setItem('userAge', age);
        localStorage.setItem('userInjury', injury);
        localStorage.setItem('userPreference', preference);
        localStorage.setItem('userGoal', goal);

        window.location.href = "dashboard.html";
    }
    </script>
</body>
</html>
